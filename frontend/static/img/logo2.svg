<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .head, .ring, .wood, .cap, .block, .block-top { stroke: #1f403e; stroke-width: 2; stroke-linejoin: round; }
    .head { fill: #cfe3e0; }
    .ring { fill: #8fbab4; }
    .wood, .block { fill: #e2c3a4; }
    .block-top { fill: #f0dcc6; }
    .cap { fill: #356864; }
    .tassel { stroke: #4caf50; }
    .tassel-end { fill: #4caf50; }
    @media (prefers-color-scheme: dark) {
      .head, .ring, .wood, .cap, .block, .block-top { stroke: #e8f5f3; }
      .head { fill: #2b4a48; }
      .ring { fill: #3d7f78; }
      .wood, .block { fill: #7a573c; }
      .block-top { fill: #8f6a4b; }
      .cap { fill: #5aa39b; }
      .tassel { stroke: #7ee0a1; }
      .tassel-end { fill: #7ee0a1; }
    }
  </style>
  <!-- Sound block -->
  <rect class="block" x="4" y="48.5" width="36" height="7" rx="2.5"/>
  <rect class="block-top" x="6.5" y="45" width="31" height="4.5" rx="2"/>
  <!-- Gavel wearing a mortarboard, hitting the sound block -->
  <g transform="translate(22 31.5) scale(.9)">
    <rect class="head" x="-8" y="-8" width="16" height="16" rx="2"/>
    <rect class="ring" x="-11.5" y="-15" width="23" height="7.5" rx="2.6"/>
    <rect class="ring" x="-11.5" y="7.5" width="23" height="7.5" rx="2.6"/>
    <rect class="wood" x="8" y="-2.2" width="30" height="4.4" rx="2.2"/>
    <circle class="ring" cx="38.5" r="2.8"/>
    <path class="cap" d="M-16-18.5 0-24.5 16-18.5 0-12.5z"/>
    <path class="tassel" d="M0-18.5 13.5-15.5v7" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="tassel-end" cx="13.5" cy="-7.2" r="1.8"/>
  </g>
</svg>
